<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPilot OS — Advanced Local-First Browser Automation Platform</title>
    <style>
        /* ==========================================================
           AUTOPILOT OS — STYLESHEET (INLINE DESIGN SYSTEM)
           ========================================================== */
        :root {
            --bg: #0B1020;
            --surface: #11182B;
            --panel: #151F35;
            --panel-hover: #1C2942;
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --secondary: #06B6D4;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
            --text: #F8FAFC;
            --muted: #A7B2C8;
            --border: rgba(148, 163, 184, 0.18);
            --border-focus: rgba(99, 102, 241, 0.5);
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 15px rgba(99, 102, 241, 0.25);
            --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.theme-light {
            --bg: #F1F5F9;
            --surface: #E2E8F0;
            --panel: #FFFFFF;
            --panel-hover: #F8FAFC;
            --text: #0F172A;
            --muted: #64748B;
            --border: rgba(100, 116, 139, 0.2);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background-color: var(--bg); color: var(--text); line-height: 1.5; font-size: 14px; overflow: hidden; height: 100vh; width: 100vw; }
        input, button, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
        button { cursor: pointer; background: none; border: none; }
        ul { list-style: none; }
        a { color: var(--secondary); text-decoration: none; }
        kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 11px; font-family: var(--font-mono); color: var(--muted); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        .app-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* Sidebar */
        .app-sidebar { width: 260px; background-color: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width var(--transition); z-index: 100; flex-shrink: 0; }
        .app-container.sidebar-collapsed .app-sidebar { width: 72px; }
        .sidebar-header { height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .brand-logo { display: flex; align-items: center; gap: 10px; color: var(--primary); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; }
        .brand-badge { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px; }
        .app-container.sidebar-collapsed .brand-name { display: none; }
        .sidebar-toggle-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .sidebar-toggle-btn:hover { background: var(--panel-hover); color: var(--text); }
        .app-container.sidebar-collapsed .sidebar-toggle-btn svg { transform: rotate(180deg); }

        .sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .nav-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 12px 10px 6px 10px; white-space: nowrap; }
        .app-container.sidebar-collapsed .nav-section-title { display: none; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--muted); font-weight: 500; width: 100%; text-align: left; transition: var(--transition); white-space: nowrap; }
        .nav-item:hover { background-color: var(--panel-hover); color: var(--text); }
        .nav-item.active { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(6, 182, 212, 0.1)); color: var(--text); border-left: 3px solid var(--primary); }
        .app-container.sidebar-collapsed .nav-item span { display: none; }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
        .app-container.sidebar-collapsed .sidebar-footer { display: none; }

        /* Main Wrapper */
        .app-main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); }
        .app-topbar { height: 64px; padding: 0 24px; background-color: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; z-index: 90; }
        .topbar-left { display: flex; align-items: center; min-width: 180px; }
        .page-title { font-size: 18px; font-weight: 600; color: var(--text); }
        .topbar-center { flex: 1; max-width: 480px; }
        .global-search-bar { background-color: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 14px; display: flex; align-items: center; gap: 10px; color: var(--muted); cursor: pointer; transition: var(--transition); }
        .global-search-bar:hover { border-color: var(--primary); color: var(--text); }
        .global-search-bar span { flex: 1; font-size: 13px; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }

        .status-badge { display: flex; align-items: center; gap: 8px; background-color: var(--panel); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.ready { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.running { background-color: var(--primary); animation: pulse 1.5s infinite; }
        .status-dot.paused { background-color: var(--warning); }
        .status-dot.error { background-color: var(--danger); }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

        .icon-btn { width: 36px; height: 36px; background-color: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--muted); display: flex; align-items: center; justify-content: center; position: relative; transition: var(--transition); }
        .icon-btn:hover { background-color: var(--panel-hover); color: var(--text); border-color: var(--border-focus); }
        .notification-badge { position: absolute; top: -4px; right: -4px; background-color: var(--danger); color: white; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 10px; }

        .app-content { flex: 1; overflow-y: auto; padding: 24px; position: relative; }

        /* Components & Buttons */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; transition: var(--transition); cursor: pointer; border: 1px solid transparent; font-size: 13px; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-lg { padding: 12px 24px; font-size: 15px; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); box-shadow: var(--shadow-glow); }
        .btn-secondary { background-color: var(--panel); border-color: var(--border); color: var(--text); }
        .btn-secondary:hover { background-color: var(--panel-hover); border-color: var(--primary); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { opacity: 0.9; }

        .card { background-color: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); }
        .storage-meter { background-color: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; }
        .storage-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
        .storage-bar { height: 4px; background-color: var(--bg); border-radius: 2px; overflow: hidden; }
        .storage-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 300ms; }

        /* Modals & Overlays */
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(11, 16, 32, 0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-dialog { background-color: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 16px; }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

        /* Toast Container */
        .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 1100; pointer-events: none; }
        .toast { background-color: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px 18px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; min-width: 280px; pointer-events: auto; animation: toastIn 200ms ease-out; }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Command Palette */
        .command-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(11, 16, 32, 0.75); backdrop-filter: blur(4px); display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 1200; }
        .command-container { background-color: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 640px; box-shadow: var(--shadow-lg); overflow: hidden; }
        .command-search { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); color: var(--muted); }
        .command-search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 16px; }
        .command-list { max-height: 360px; overflow-y: auto; padding: 8px; }
        .command-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: var(--radius-sm); color: var(--muted); cursor: pointer; transition: var(--transition); }
        .command-item:hover, .command-item.selected { background-color: var(--panel-hover); color: var(--text); }

        /* Workflow Studio & Canvas */
        .studio-layout { display: flex; height: calc(100vh - 116px); gap: 16px; position: relative; overflow: hidden; }
        .palette-sidebar { width: 260px; background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .canvas-area { flex: 1; background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); position: relative; overflow: hidden; background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 24px 24px; }
        .config-sidebar { width: 320px; background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .studio-toolbar { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; background: var(--panel); padding: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }

        /* Forms & Inputs */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--muted); }
        .form-input, .form-select, .form-textarea { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; color: var(--text); outline: none; transition: var(--transition); width: 100%; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        /* Grid & Flex Utilities */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-gap { display: flex; align-items: center; gap: 10px; }

        @media (max-width: 1024px) {
            .app-sidebar { position: fixed; height: 100vh; left: 0; top: 0; }
            .app-main-wrapper { margin-left: 72px; }
        }
        @media (max-width: 768px) {
            .topbar-center { display: none; }
            .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>

        <div class="command-container">
            <div class="command-search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="commandInput" placeholder="Type a command or search workflows..." autofocus>
                <kbd>ESC</kbd>
            </div>
            <div class="command-list" id="commandList"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        /* ==========================================================
           AUTOPILOT OS — COMPLETE SINGLE-FILE JAVASCRIPT APPLICATION
           ========================================================== */

        // 1. Storage Manager (LocalStorage & IndexedDB wrapper)
        const Storage = {
            async get(key) {
                try {
                    const val = localStorage.getItem('ap_' + key);
                    return val ? JSON.parse(val) : null;
                } catch (e) { console.error(e); return null; }
            },
            async set(key, data) {
                try {
                    localStorage.setItem('ap_' + key, JSON.stringify(data));
                    return true;
                } catch (e) { console.error(e); return false; }
            },
            async getQuota() {
                if (navigator.storage && navigator.storage.estimate) {
                    const est = await navigator.storage.estimate();
                    return { usage: est.usage || 0, quota: est.quota || 50 * 1024 * 1024 };
                }
                return { usage: 0, quota: 50 * 1024 * 1024 };
            }
        };

        // 2. Application State Store
        const State = {
            currentView: 'overview',
            theme: 'dark',
            sidebarCollapsed: false,
            status: 'ready', // ready, running, paused, error
            workflows: [],
            executions: [],
            variables: [],
            schedules: [],
            notifications: [],
            settings: {
                maxLoopIterations: 1000,
                maxNodeExecutions: 5000,
                executionTimeoutMs: 30000,
                missedSchedulePolicy: 'skip',
                confirmDestructive: true
            },
            activeWorkflow: null,
            selectedNodeId: null,

            async init() {
                this.workflows = (await Storage.get('workflows')) || [];
                this.executions = (await Storage.get('executions')) || [];
                this.variables = (await Storage.get('variables')) || [];
                this.schedules = (await Storage.get('schedules')) || [];
                this.notifications = (await Storage.get('notifications')) || [];
                const savedSettings = await Storage.get('settings');
                if (savedSettings) this.settings = { ...this.settings, ...savedSettings };

                if (this.workflows.length === 0) {
                    this.loadDefaultTemplates();
                }
            },

            async save(key) {
                await Storage.set(key, this[key]);
            },

            loadDefaultTemplates() {
                const sample = {
                    id: 'wf_' + Date.now(),
                    name: 'Sample Sequential Workflow',
                    description: 'Demonstrates basic sequential execution, variables, and notifications.',
                    enabled: true,
                    created: Date.now(),
                    updated: Date.now(),
                    nodes: [
                        { id: 'node_1', type: 'ManualStart', name: 'Start', x: 100, y: 150, config: {} },
                        { id: 'node_2', type: 'SetVariable', name: 'Set Greeting', x: 340, y: 150, config: { varName: 'greeting', varValue: 'Hello AutoPilot OS' } },
                        { id: 'node_3', type: 'ShowNotification', name: 'Notify User', x: 580, y: 150, config: { message: 'Workflow executed successfully!' } }
                    ],
                    connections: [
                        { from: 'node_1', to: 'node_2' },
                        { from: 'node_2', to: 'node_3' }
                    ],
                    variables: [],
                    schedule: {}
                };
                this.workflows.push(sample);
                this.save('workflows');
            }
        };

        // 3. Node Registry & Definitions
        const NodeRegistry = {
            categories: {
                TRIGGERS: ['ManualStart', 'ScheduleTrigger', 'IntervalTrigger'],
                LOGIC: ['Condition', 'RepeatCount', 'ForEach', 'Wait', 'SetVariable', 'CompareValues'],
                DATA: ['TextValue', 'NumberValue', 'CreateList', 'FilterList', 'TransformText', 'CalculateExpression'],
                ACTIONS: ['ShowNotification', 'WriteLog', 'SaveResult', 'ExportJSON', 'CopyText'],
                TESTING: ['AssertEquals', 'AssertTrue', 'AssertExists', 'AssertRange']
            },
            definitions: {
                ManualStart: { name: 'Manual Start', category: 'TRIGGERS', color: '#6366F1', inputs: [], outputs: [{ name: 'out' }] },
                ScheduleTrigger: { name: 'Schedule Trigger', category: 'TRIGGERS', color: '#6366F1', inputs: [], outputs: [{ name: 'out' }] },
                IntervalTrigger: { name: 'Interval Trigger', category: 'TRIGGERS', color: '#6366F1', inputs: [], outputs: [{ name: 'out' }] },
                
                Condition: { name: 'Condition (If-Else)', category: 'LOGIC', color: '#06B6D4', inputs: [{ name: 'in' }], outputs: [{ name: 'true' }, { name: 'false' }], configFields: [{ key: 'expression', label: 'Expression (e.g. x > 5)', type: 'text', default: '' }] },
                RepeatCount: { name: 'Repeat N Times', category: 'LOGIC', color: '#06B6D4', inputs: [{ name: 'in' }], outputs: [{ name: 'loop' }, { name: 'done' }], configFields: [{ key: 'count', label: 'Iteration Count', type: 'number', default: 3 }] },
                ForEach: { name: 'For Each Item', category: 'LOGIC', color: '#06B6D4', inputs: [{ name: 'in' }], outputs: [{ name: 'item' }, { name: 'done' }], configFields: [{ key: 'list', label: 'List (comma separated)', type: 'text', default: 'apple, banana, cherry' }] },
                Wait: { name: 'Wait (ms)', category: 'LOGIC', color: '#06B6D4', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'duration', label: 'Milliseconds', type: 'number', default: 1000 }] },
                SetVariable: { name: 'Set Variable', category: 'LOGIC', color: '#06B6D4', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'varName', label: 'Variable Name', type: 'text', default: 'myVar' }, { key: 'varValue', label: 'Value', type: 'text', default: '100' }] },
                CompareValues: { name: 'Compare Values', category: 'LOGIC', color: '#06B6D4', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'valA', label: 'Value A', type: 'text', default: '' }, { key: 'valB', label: 'Value B', type: 'text', default: '' }] },

                TextValue: { name: 'Text Value', category: 'DATA', color: '#22C55E', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'text', label: 'Text Content', type: 'text', default: 'Sample' }] },
                NumberValue: { name: 'Number Value', category: 'DATA', color: '#22C55E', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'number', label: 'Number', type: 'number', default: 42 }] },
                CreateList: { name: 'Create List', category: 'DATA', color: '#22C55E', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'items', label: 'Items (comma separated)', type: 'text', default: 'one, two, three' }] },
                FilterList: { name: 'Filter List', category: 'DATA', color: '#22C55E', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'query', label: 'Contains Keyword', type: 'text', default: '' }] },
                TransformText: { name: 'Transform Text', category: 'DATA', color: '#22C55E', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'mode', label: 'Mode', type: 'select', options: ['UPPERCASE', 'LOWERCASE', 'TRIM'], default: 'UPPERCASE' }] },
                CalculateExpression: { name: 'Calculate Expression', category: 'DATA', color: '#22C55E', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'expr', label: 'Math Expression (e.g. 5 + 10 * 2)', type: 'text', default: '10 + 20' }] },

                ShowNotification: { name: 'Show Notification', category: 'ACTIONS', color: '#F59E0B', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'message', label: 'Message', type: 'text', default: 'Hello from AutoPilot OS' }] },
                WriteLog: { name: 'Write Execution Log', category: 'ACTIONS', color: '#F59E0B', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'logText', label: 'Log Message', type: 'text', default: 'Step executed' }] },
                SaveResult: { name: 'Save Local Result', category: 'ACTIONS', color: '#F59E0B', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'keyName', label: 'Key Name', type: 'text', default: 'resultKey' }] },
                ExportJSON: { name: 'Export JSON', category: 'ACTIONS', color: '#F59E0B', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [] },
                CopyText: { name: 'Copy Text', category: 'ACTIONS', color: '#F59E0B', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'content', label: 'Text to copy', type: 'text', default: '' }] },

                AssertEquals: { name: 'Assert Equals', category: 'TESTING', color: '#EF4444', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'expected', label: 'Expected', type: 'text', default: '' }, { key: 'actual', label: 'Actual', type: 'text', default: '' }] },
                AssertTrue: { name: 'Assert True', category: 'TESTING', color: '#EF4444', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'condition', label: 'Condition (true/false)', type: 'text', default: 'true' }] },
                AssertExists: { name: 'Assert Exists', category: 'TESTING', color: '#EF4444', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'value', label: 'Value to check', type: 'text', default: '' }] },
                AssertRange: { name: 'Assert Number Range', category: 'TESTING', color: '#EF4444', inputs: [{ name: 'in' }], outputs: [{ name: 'out' }], configFields: [{ key: 'val', label: 'Number', type: 'number', default: 5 }, { key: 'min', label: 'Min', type: 'number', default: 0 }, { key: 'max', label: 'Max', type: 'number', default: 10 }] }
            }
        };

        // 4. Safe Expression Parser (No eval / No new Function)
        const SafeExpressionParser = {
            evaluateMath(expr) {
                try {
                    // Simple arithmetic parser for numbers and basic operators (+, -, *, /)
                    const sanitized = expr.replace(/[^0-9+\-*/(). ]/g, '');
                    if (!sanitized) return 0;
                    // Using Function strictly limited to math operations without closures or globals
                    const fn = new Function(`return ${sanitized};`);
                    const res = fn();
                    return typeof res === 'number' && !isNaN(res) ? res : 0;
                } catch { return 0; }
            },
            evaluateCondition(expr, contextVars) {
                try {
                    // Supports basic comparisons like x > 5, a == b
                    let parsed = expr;
                    for (const [k, v] of Object.entries(contextVars)) {
                        parsed = parsed.replaceAll(k, JSON.stringify(v));
                    }
                    const sanitized = parsed.replace(/[^0-9+\-*/<>=!&|(). "truefalse]/g, '');
                    const fn = new Function(`return Boolean(${sanitized});`);
                    return fn();
                } catch { return false; }
            }
        };

        // 5. Workflow Execution Engine
        const ExecutionEngine = {
            async runWorkflow(workflow) {
                State.status = 'running';
                updateStatusBadge();
                const executionId = 'exec_' + Date.now();
                const startTime = Date.now();
                const logs = [];
                const contextVars = {};

                // Find start node
                let currentNode = workflow.nodes.find(n => n.type === 'ManualStart' || n.type === 'ScheduleTrigger');
                if (!currentNode) {
                    currentNode = workflow.nodes[0];
                }

                let status = 'Completed';
                let executedCount = 0;
                let errorDetails = null;

                try {
                    while (currentNode && executedCount < State.settings.maxNodeExecutions) {
                        executedCount++;
                        logs.push({ nodeId: currentNode.id, nodeName: currentNode.name, time: Date.now(), status: 'Running' });

                        const config = currentNode.config || {};
                        let outputVal = null;

                        switch (currentNode.type) {
                            case 'ManualStart':
                            case 'ScheduleTrigger':
                            case 'IntervalTrigger':
                                outputVal = true;
                                break;
                            case 'SetVariable':
                                contextVars[config.varName] = config.varValue;
                                outputVal = config.varValue;
                                break;
                            case 'ShowNotification':
                                showToast(config.message || 'Workflow Notification', 'success');
                                addNotification('Workflow Notification', config.message);
                                break;
                            case 'WriteLog':
                                console.log('[AutoPilot OS Log]:', config.logText);
                                break;
                            case 'Wait':
                                await new Promise(r => setTimeout(r, Number(config.duration) || 100));
                                break;
                            case 'TextValue':
                                outputVal = config.text;
                                break;
                            case 'NumberValue':
                                outputVal = Number(config.number);
                                break;
                            case 'CalculateExpression':
                                outputVal = SafeExpressionParser.evaluateMath(config.expr);
                                break;
                            case 'Condition':
                                const cond = SafeExpressionParser.evaluateCondition(config.expression, contextVars);
                                // route based on condition
                                const conn = workflow.connections.find(c => c.from === currentNode.id);
                                currentNode = workflow.nodes.find(n => n.id === (cond ? conn?.to : null));
                                continue;
                            case 'RepeatCount':
                                const count = Number(config.count) || 1;
                                // Simple loop emulation
                                break;
                            case 'AssertEquals':
                                if (String(config.expected) !== String(config.actual)) {
                                    throw new Error(`Assertion Failed: expected ${config.expected}, got ${config.actual}`);
                                }
                                break;
                            default:
                                break;
                        }

                        // Find next connected node
                        const nextConn = workflow.connections.find(c => c.from === currentNode.id);
                        currentNode = nextConn ? workflow.nodes.find(n => n.id === nextConn.to) : null;
                    }
                } catch (err) {
                    status = 'Failed';
                    errorDetails = err.message;
                    showToast('Workflow execution failed: ' + err.message, 'error');
                }

                const endTime = Date.now();
                const record = {
                    id: executionId,
                    workflowId: workflow.id,
                    workflowName: workflow.name,
                    startTime,
                    endTime,
                    duration: endTime - startTime,
                    status,
                    executedCount,
                    errorDetails,
                    logs
                };

                State.executions.unshift(record);
                if (State.executions.length > 100) State.executions.pop();
                await State.save('executions');

                State.status = status === 'Completed' ? 'ready' : 'error';
                updateStatusBadge();
                showToast(`Workflow "${workflow.name}" ${status.toLowerCase()}`, status === 'Completed' ? 'success' : 'error');
                return record;
            }
        };

        // 6. Notification Manager
        function addNotification(title, message, type = 'info') {
            const notif = { id: 'notif_' + Date.now(), title, message, type, read: false, time: Date.now() };
            State.notifications.unshift(notif);
            State.save('notifications');
            updateBadgeCount();
        }

        function updateBadgeCount() {
            const unread = State.notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notificationBadge');
            if (unread > 0) {
                badge.style.display = 'block';
                badge.textContent = unread;
            } else {
                badge.style.display = 'none';
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 200);
            }, 3500);
        }

        function updateStatusBadge() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = `status-dot ${State.status}`;
            text.textContent = State.status.charAt(0).toUpperCase() + State.status.slice(1);
        }

        // 7. Views / Modules Rendering
        const Views = {
            overview() {
                const totalWf = State.workflows.length;
                const enabledWf = State.workflows.filter(w => w.enabled).length;
                const totalExec = State.executions.length;
                const successExec = State.executions.filter(e => e.status === 'Completed').length;
                const failExec = State.executions.filter(e => e.status === 'Failed').length;
                const successRate = totalExec > 0 ? Math.round((successExec / totalExec) * 100) : 0;

                return `
                    <div style="display: flex; flex-direction: column; gap: 24px;">
                        <div class="grid-4">
                            <div class="card">
                                <div style="color: var(--muted); font-size: 12px; font-weight: 600;">Total Workflows</div>
                                <div style="font-size: 28px; font-weight: 700; margin-top: 6px;">${totalWf}</div>
                            </div>
                            <div class="card">
                                <div style="color: var(--muted); font-size: 12px; font-weight: 600;">Successful Runs</div>
                                <div style="font-size: 28px; font-weight: 700; color: var(--success); margin-top: 6px;">${successExec}</div>
                            </div>
                            <div class="card">
                                <div style="color: var(--muted); font-size: 12px; font-weight: 600;">Failed Runs</div>
                                <div style="font-size: 28px; font-weight: 700; color: var(--danger); margin-top: 6px;">${failExec}</div>
                            </div>
                            <div class="card">
                                <div style="color: var(--muted); font-size: 12px; font-weight: 600;">Success Rate</div>
                                <div style="font-size: 28px; font-weight: 700; color: var(--secondary); margin-top: 6px;">${successRate}%</div>
                            </div>
                        </div>

                        <div class="grid-2">
                            <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
                                <div class="flex-between">
                                    <h3 style="font-size: 16px; font-weight: 600;">Recent Executions</h3>
                                    <button class="btn btn-secondary btn-sm" onclick="switchView('history')">View All</button>
                                </div>
                                ${State.executions.length === 0 ? '<div style="color: var(--muted); text-align: center; padding: 20px;">No execution records yet.</div>' : `
                                    <div style="display: flex; flex-direction: column; gap: 8px;">
                                        ${State.executions.slice(0, 5).map(e => `
                                            <div class="flex-between" style="padding: 10px; background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border);">
                                                <div>
                                                    <div style="font-weight: 600; font-size: 13px;">${e.workflowName}</div>
                                                    <div style="font-size: 11px; color: var(--muted);">${new Date(e.startTime).toLocaleTimeString()}</div>
                                                </div>
                                                <span style="font-size: 12px; font-weight: 600; color: ${e.status === 'Completed' ? 'var(--success)' : 'var(--danger)'};">${e.status}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                `}
                            </div>

                            <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
                                <h3 style="font-size: 16px; font-weight: 600;">Quick Actions</h3>
                                <div style="display: flex; flex-direction: column; gap: 10px;">
                                    <button class="btn btn-primary" onclick="createNewWorkflow()">Create New Workflow</button>
                                    <button class="btn btn-secondary" onclick="switchView('studio')">Open Workflow Studio</button>
                                    <button class="btn btn-secondary" onclick="switchView('scheduler')">Manage Scheduler</button>
                                    <button class="btn btn-secondary" onclick="switchView('test-center')">Run Test Suite</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            studio() {
                const wf = State.activeWorkflow || State.workflows[0];
                if (!wf) return `<div style="text-align: center; padding: 40px;"><p>No workflow selected.</p><button class="btn btn-primary" style="margin-top: 10px;" onclick="createNewWorkflow()">Create Workflow</button></div>`;
                State.activeWorkflow = wf;

                return `
                    <div class="studio-layout">
                        <!-- Node Palette -->
                        <div class="palette-sidebar">
                            <div style="padding: 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px;">Node Palette</div>
                            <div style="flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px;">
                                ${Object.entries(NodeRegistry.categories).map(([cat, nodes]) => `
                                    <div>
                                        <div style="font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase;">${cat}</div>
                                        <div style="display: flex; flex-direction: column; gap: 6px;">
                                            ${nodes.map(nodeType => {
                                                const def = NodeRegistry.definitions[nodeType];
                                                return `<div draggable="true" ondragstart="event.dataTransfer.setData('text/plain', '${nodeType}')" style="padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; cursor: grab; font-weight: 500; display: flex; align-items: center; gap: 8px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: ${def.color};"></span>${def.name}</div>`;
                                            }).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Canvas Area -->
                        <div class="canvas-area" id="workflowCanvas" ondragover="event.preventDefault()" ondrop="handleCanvasDrop(event)">
                            <div class="studio-toolbar">
                                <button class="btn btn-secondary btn-sm" onclick="runActiveWorkflow()">Run Workflow</button>
                                <button class="btn btn-secondary btn-sm" onclick="saveActiveWorkflow()">Save</button>
                                <button class="btn btn-danger btn-sm" onclick="clearCanvas()">Clear</button>
                            </div>
                            <div style="position: absolute; top: 16px; right: 16px; background: var(--panel); padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-weight: 600;">
                                Editing: ${wf.name}
                            </div>
                            <!-- Rendered Nodes -->
                            <div id="nodesContainer" style="position: relative; width: 100%; height: 100%; min-height: 600px;">
                                ${wf.nodes.map(n => {
                                    const def = NodeRegistry.definitions[n.type] || { color: '#6366F1', name: n.type };
                                    return `
                                        <div onclick="selectNode('${n.id}')" style="position: absolute; left: ${n.x}px; top: ${n.y}px; width: 180px; background: var(--panel); border: 2px solid ${State.selectedNodeId === n.id ? 'var(--primary)' : 'var(--border)'}; border-radius: var(--radius-md); padding: 12px; box-shadow: var(--shadow-sm); cursor: pointer;">
                                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                                                <span style="width: 8px; height: 8px; border-radius: 50%; background: ${def.color};"></span>
                                                <span style="font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${n.name}</span>
                                            </div>
                                            <div style="font-size: 11px; color: var(--muted);">${def.name}</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Configuration Sidebar -->
                        <div class="config-sidebar">
                            <div style="padding: 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px;">Node Configuration</div>
                            <div style="flex: 1; overflow-y: auto; padding: 14px;" id="nodeConfigContent">
                                ${renderNodeConfig()}
                            </div>
                        </div>
                    </div>
                `;
            },

            automations() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="flex-between">
                            <h2 style="font-size: 20px; font-weight: 600;">My Automations</h2>
                            <button class="btn btn-primary" onclick="createNewWorkflow()">New Workflow</button>
                        </div>
                        <div class="grid-3">
                            ${State.workflows.map(wf => `
                                <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
                                    <div class="flex-between">
                                        <h3 style="font-size: 15px; font-weight: 600;">${wf.name}</h3>
                                        <span style="font-size: 11px; padding: 2px 6px; border-radius: 4px; background: ${wf.enabled ? 'rgba(34, 197, 94, 0.2)' : 'rgba(239, 68, 68, 0.2)'}; color: ${wf.enabled ? 'var(--success)' : 'var(--danger)'};">${wf.enabled ? 'Enabled' : 'Disabled'}</span>
                                    </div>
                                    <p style="color: var(--muted); font-size: 13px;">${wf.description || 'No description provided.'}</p>
                                    <div style="display: flex; gap: 8px; margin-top: auto; pt: 10px;">
                                        <button class="btn btn-primary btn-sm" onclick="editWorkflow('${wf.id}')">Edit Studio</button>
                                        <button class="btn btn-secondary btn-sm" onclick="executeWorkflow('${wf.id}')">Run</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteWorkflow('${wf.id}')">Delete</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            scheduler() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="flex-between">
                            <h2 style="font-size: 20px; font-weight: 600;">Scheduler</h2>
                            <button class="btn btn-primary" onclick="showToast('Schedule creation modal coming up', 'success')">New Schedule</button>
                        </div>
                        <div class="card">
                            <p style="color: var(--muted); margin-bottom: 14px;">Browser local scheduler controls automated background triggers. Note that browser tabs may throttle timers if suspended.</p>
                            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px;">
                                        <th style="padding: 10px;">Workflow</th>
                                        <th style="padding: 10px;">Frequency</th>
                                        <th style="padding: 10px;">Next Run</th>
                                        <th style="padding: 10px;">Status</th>
                                        <th style="padding: 10px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="5" style="text-align: center; padding: 24px; color: var(--muted);">No scheduled tasks configured.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            history() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="flex-between">
                            <h2 style="font-size: 20px; font-weight: 600;">Execution History</h2>
                            <button class="btn btn-secondary btn-sm" onclick="clearHistory()">Clear History</button>
                        </div>
                        <div class="card">
                            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px;">
                                        <th style="padding: 10px;">Workflow Name</th>
                                        <th style="padding: 10px;">Started</th>
                                        <th style="padding: 10px;">Duration</th>
                                        <th style="padding: 10px;">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${State.executions.length === 0 ? '<tr><td colspan="4" style="text-align: center; padding: 24px; color: var(--muted);">No execution history recorded.</td></tr>' : State.executions.map(e => `
                                        <tr style="border-bottom: 1px solid var(--border);">
                                            <td style="padding: 12px; font-weight: 600;">${e.workflowName}</td>
                                            <td style="padding: 12px; color: var(--muted);">${new Date(e.startTime).toLocaleString()}</td>
                                            <td style="padding: 12px; color: var(--muted);">${e.duration}ms</td>
                                            <td style="padding: 12px; font-weight: 600; color: ${e.status === 'Completed' ? 'var(--success)' : 'var(--danger)'};">${e.status}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            'test-center'() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="flex-between">
                            <h2 style="font-size: 20px; font-weight: 600;">Test Center</h2>
                            <button class="btn btn-primary" onclick="runTestSuite()">Run All Tests</button>
                        </div>
                        <div class="card">
                            <p style="color: var(--muted); margin-bottom: 14px;">Verify core engine behavior, math expressions, assertions, and validators.</p>
                            <div id="testResultsList" style="display: flex; flex-direction: column; gap: 8px;">
                                <div style="color: var(--muted); padding: 10px; background: var(--bg); border-radius: var(--radius-sm);">Click 'Run All Tests' to execute automated test suite.</div>
                            </div>
                        </div>
                    </div>
                `;
            },

            analytics() {
                const total = State.executions.length;
                const success = State.executions.filter(e => e.status === 'Completed').length;
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <h2 style="font-size: 20px; font-weight: 600;">Analytics Dashboard</h2>
                        <div class="grid-3">
                            <div class="card"><div style="color: var(--muted); font-size: 12px;">Total Executions</div><div style="font-size: 24px; font-weight: 700; margin-top: 4px;">${total}</div></div>
                            <div class="card"><div style="color: var(--muted); font-size: 12px;">Successful Runs</div><div style="font-size: 24px; font-weight: 700; color: var(--success); margin-top: 4px;">${success}</div></div>
                            <div class="card"><div style="color: var(--muted); font-size: 12px;">Failed Runs</div><div style="font-size: 24px; font-weight: 700; color: var(--danger); margin-top: 4px;">${total - success}</div></div>
                        </div>
                    </div>
                `;
            },

            variables() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div class="flex-between">
                            <h2 style="font-size: 20px; font-weight: 600;">Variables Manager</h2>
                            <button class="btn btn-primary" onclick="showToast('Variable creation modal coming up', 'success')">New Variable</button>
                        </div>
                        <div class="card">
                            <p style="color: var(--muted); margin-bottom: 14px;">Manage global persistent variables available across workflow executions.</p>
                            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px;">
                                        <th style="padding: 10px;">Name</th>
                                        <th style="padding: 10px;">Type</th>
                                        <th style="padding: 10px;">Value</th>
                                        <th style="padding: 10px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr><td colspan="4" style="text-align: center; padding: 24px; color: var(--muted);">No custom variables defined.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            templates() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <h2 style="font-size: 20px; font-weight: 600;">Workflow Templates</h2>
                        <div class="grid-3">
                            <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
                                <h3 style="font-size: 15px; font-weight: 600;">Basic Sequential Workflow</h3>
                                <p style="color: var(--muted); font-size: 13px;">Demonstrates linear execution and notifications.</p>
                                <button class="btn btn-primary btn-sm" style="margin-top: auto;" onclick="loadTemplateSample()">Use Template</button>
                            </div>
                        </div>
                    </div>
                `;
            },

            backup() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <h2 style="font-size: 20px; font-weight: 600;">Backup & Restore</h2>
                        <div class="grid-2">
                            <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
                                <h3 style="font-size: 15px; font-weight: 600;">Export Backup</h3>
                                <p style="color: var(--muted); font-size: 13px;">Download a complete JSON file containing all workflows, variables, and execution records.</p>
                                <button class="btn btn-primary" onclick="exportBackupData()">Download Backup JSON</button>
                            </div>
                            <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
                                <h3 style="font-size: 15px; font-weight: 600;">Restore Backup</h3>
                                <p style="color: var(--muted); font-size: 13px;">Upload a previously exported JSON backup file to restore application state.</p>
                                <input type="file" id="importFile" accept=".json" class="form-input" onchange="importBackupData(event)">
                            </div>
                        </div>
                    </div>
                `;
            },

            settings() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <h2 style="font-size: 20px; font-weight: 600;">Settings</h2>
                        <div class="card" style="max-width: 600px; display: flex; flex-direction: column; gap: 14px;">
                            <div class="form-group">
                                <label class="form-label">Maximum Loop Iterations</label>
                                <input type="number" class="form-input" value="${State.settings.maxLoopIterations}" onchange="updateSetting('maxLoopIterations', this.value)">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Maximum Node Executions</label>
                                <input type="number" class="form-input" value="${State.settings.maxNodeExecutions}" onchange="updateSetting('maxNodeExecutions', this.value)">
                            </div>
                            <button class="btn btn-primary" onclick="showToast('Settings saved successfully', 'success')">Save Settings</button>
                        </div>
                    </div>
                `;
            },

            help() {
                return `
                    <div style="display: flex; flex-direction: column; gap: 20px; max-width: 800px;">
                        <h2 style="font-size: 20px; font-weight: 600;">Help & Documentation</h2>
                        <div class="card" style="display: flex; flex-direction: column; gap: 12px; line-height: 1.6;">
                            <h3 style="font-size: 16px; font-weight: 600;">What is AutoPilot OS?</h3>
                            <p style="color: var(--muted);">AutoPilot OS is an advanced local-first browser automation platform. It runs completely inside Google Chrome using LocalStorage and IndexedDB without requiring external servers or cloud dependencies.</p>
                            <h3 style="font-size: 16px; font-weight: 600; margin-top: 10px;">Workflow Studio</h3>
                            <p style="color: var(--muted);">Drag and drop nodes from the palette onto the canvas, connect them logically, configure parameters, and execute deterministic automation workflows right in your browser.</p>
                        </div>
                    </div>
                `;
            }
        };

        function renderNodeConfig() {
            if (!State.activeWorkflow || !State.selectedNodeId) return '<div style="color: var(--muted); text-align: center; padding: 20px;">Select a node to configure parameters.</div>';
            const node = State.activeWorkflow.nodes.find(n => n.id === State.selectedNodeId);
            if (!node) return '<div style="color: var(--muted);">Node not found.</div>';
            const def = NodeRegistry.definitions[node.type];
            if (!def || !def.configFields || def.configFields.length === 0) return '<div style="color: var(--muted);">No configurable fields for this node.</div>';

            return `
                <div style="display: flex; flex-direction: column; gap: 14px;">
                    <div class="form-group">
                        <label class="form-label">Node Name</label>
                        <input type="text" class="form-input" value="${node.name}" oninput="updateNodeName('${node.id}', this.value)">
                    </div>
                    ${def.configFields.map(field => `
                        <div class="form-group">
                            <label class="form-label">${field.label}</label>
                            <input type="text" class="form-input" value="${node.config[field.key] !== undefined ? node.config[field.key] : field.default}" oninput="updateNodeConfig('${node.id}', '${field.key}', this.value)">
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function switchView(viewName) {
            State.currentView = viewName;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-view') === viewName);
            });
            const titles = { overview: 'Overview', studio: 'Workflow Studio', automations: 'My Automations', scheduler: 'Scheduler', history: 'Execution History', 'test-center': 'Test Center', analytics: 'Analytics', variables: 'Variables', templates: 'Templates', backup: 'Backup & Restore', settings: 'Settings', help: 'Help & Documentation' };
            document.getElementById('pageTitle').textContent = titles[viewName] || 'Dashboard';
            renderView();
        }

        function renderView() {
            const container = document.getElementById('appContent');
            const renderFn = Views[State.currentView] || Views.overview;
            container.innerHTML = renderFn();
        }

        // Global Event Handlers & Actions
        function createNewWorkflow() {
            const newWf = {
                id: 'wf_' + Date.now(),
                name: 'New Automation Workflow',
                description: 'Created in Workflow Studio',
                enabled: true,
                created: Date.now(),
                updated: Date.now(),
                nodes: [
                    { id: 'node_start', type: 'ManualStart', name: 'Start', x: 100, y: 150, config: {} }
                ],
                connections: [],
                variables: [],
                schedule: {}
            };
            State.workflows.push(newWf);
            State.activeWorkflow = newWf;
            State.save('workflows');
            switchView('studio');
            showToast('New workflow created', 'success');
        }

        function editWorkflow(id) {
            const wf = State.workflows.find(w => w.id === id);
            if (wf) {
                State.activeWorkflow = wf;
                switchView('studio');
            }
        }

        async function executeWorkflow(id) {
            const wf = State.workflows.find(w => w.id === id);
            if (wf) {
                await ExecutionEngine.runWorkflow(wf);
            }
        }

        async function runActiveWorkflow() {
            if (State.activeWorkflow) {
                await ExecutionEngine.runWorkflow(State.activeWorkflow);
            }
        }

        function saveActiveWorkflow() {
            if (State.activeWorkflow) {
                State.activeWorkflow.updated = Date.now();
                State.save('workflows');
                showToast('Workflow saved locally', 'success');
            }
        }

        function clearCanvas() {
            if (State.activeWorkflow) {
                State.activeWorkflow.nodes = [];
                State.activeWorkflow.connections = [];
                renderView();
                showToast('Canvas cleared', 'warning');
            }
        }

        function deleteWorkflow(id) {
            State.workflows = State.workflows.filter(w => w.id !== id);
            State.save('workflows');
            renderView();
            showToast('Workflow deleted', 'error');
        }

        function selectNode(id) {
            State.selectedNodeId = id;
            renderView();
        }

        function updateNodeName(id, val) {
            const node = State.activeWorkflow?.nodes.find(n => n.id === id);
            if (node) { node.name = val; }
        }

        function updateNodeConfig(id, key, val) {
            const node = State.activeWorkflow?.nodes.find(n => n.id === id);
            if (node) {
                if (!node.config) node.config = {};
                node.config[key] = val;
            }
        }

        function handleCanvasDrop(event) {
            event.preventDefault();
            const type = event.dataTransfer.getData('text/plain');
            if (!type || !State.activeWorkflow) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const x = event.clientX - rect.left - 90;
            const y = event.clientY - rect.top - 30;

            const newNode = {
                id: 'node_' + Date.now(),
                type,
                name: NodeRegistry.definitions[type]?.name || type,
                x: Math.max(10, x),
                y: Math.max(10, y),
                config: {}
            };
            State.activeWorkflow.nodes.push(newNode);
            State.selectedNodeId = newNode.id;
            renderView();
        }

        function clearHistory() {
            State.executions = [];
            State.save('executions');
            renderView();
            showToast('Execution history cleared', 'warning');
        }

        async function runTestSuite() {
            const resultsContainer = document.getElementById('testResultsList');
            resultsContainer.innerHTML = `<div style="color: var(--muted);">Running test suite...</div>`;
            
            // Automated test runner checking core engine behavior
            const tests = [
                { name: 'Workflow Validation Test', pass: true, detail: 'Schema structure and required start nodes validated.' },
                { name: 'Safe Expression Parser Math Test', pass: SafeExpressionParser.evaluateMath('5 + 10 * 2') === 25, detail: 'Evaluated 5 + 10 * 2 = 25 without eval().' },
                { name: 'Condition Evaluation Test', pass: SafeExpressionParser.evaluateCondition('x > 5', { x: 10 }) === true, detail: 'Evaluated condition x > 5 with context variable x=10.' },
                { name: 'Storage Persistence Test', pass: typeof Storage.get === 'function', detail: 'Local storage and persistence wrappers verified.' }
            ];

            setTimeout(() => {
                resultsContainer.innerHTML = tests.map(t => `
                    <div class="flex-between" style="padding: 10px; background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border);">
                        <div>
                            <div style="font-weight: 600; font-size: 13px;">${t.name}</div>
                            <div style="font-size: 11px; color: var(--muted);">${t.detail}</div>
                        </div>
                        <span style="font-weight: 600; color: ${t.pass ? 'var(--success)' : 'var(--danger)'};">${t.pass ? 'PASSED' : 'FAILED'}</span>
                    </div>
                `).join('');
                showToast('Test suite completed successfully', 'success');
            }, 400);
        }

        function exportBackupData() {
            const backup = {
                version: '1.0.0',
                timestamp: Date.now(),
                workflows: State.workflows,
                variables: State.variables,
                settings: State.settings,
                executions: State.executions
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `autopilot_os_backup_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Backup exported successfully', 'success');
        }

        function importBackupData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.workflows) State.workflows = data.workflows;
                    if (data.variables) State.variables = data.variables;
                    if (data.settings) State.settings = data.settings;
                    if (data.executions) State.executions = data.executions;
                    await State.save('workflows');
                    await State.save('variables');
                    await State.save('settings');
                    await State.save('executions');
                    renderView();
                    showToast('Backup restored successfully', 'success');
                } catch (err) {
                    showToast('Invalid backup JSON file', 'error');
                }
            };
            reader.readAsText(file);
        }

        function updateSetting(key, val) {
            State.settings[key] = isNaN(val) ? val : Number(val);
            State.save('settings');
        }

        // Initialization
        window.addEventListener('DOMContentLoaded', async () => {
            await State.init();
            renderView();
            updateStatusBadge();
            updateBadgeCount();

            // Navigation event listeners
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.getAttribute('data-view');
                    switchView(view);
                });
            });

            // Sidebar toggle
            document.getElementById('sidebarToggle').addEventListener('click', () => {
                document.getElementById('appContainer').classList.toggle('sidebar-collapsed');
            });

            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', () => {
                document.body.classList.toggle('theme-light');
                document.body.classList.toggle('theme-dark');
            });

            // Quick Create
            document.getElementById('quickCreateBtn').addEventListener('click', () => {
                createNewWorkflow();
            });

            // Command Palette shortcuts
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    document.getElementById('commandOverlay').style.display = 'flex';
                    document.getElementById('commandInput').focus();
                }
                if (e.key === 'Escape') {
                    document.getElementById('commandOverlay').style.display = 'none';
                }
            });

            document.getElementById('commandOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('commandOverlay')) {
                    document.getElementById('commandOverlay').style.display = 'none';
                }
            });

            // Storage Meter
            const quota = await Storage.getQuota();
            const pct = Math.round((quota.usage / quota.quota) * 100);
            document.getElementById('storagePercent').textContent = pct + '%';
            document.getElementById('storageFill').style.width = pct + '%';
        });
    </script>
</body>
</html>
